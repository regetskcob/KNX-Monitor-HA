# Monthly, grouped updates for the pinned actions and test requirements: one
# pull request per ecosystem instead of one per package.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      test-requirements:
        patterns: ["*"]
