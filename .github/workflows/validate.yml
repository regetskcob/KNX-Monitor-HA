# Checks of the KNX Monitor integration on every push and pull request:
# Home Assistant's hassfest, the HACS validation, lint and the tests.
# Actions are pinned by commit SHA (the tag or branch in the comment), so a
# moved tag cannot run foreign code with this repository's token; Dependabot
# proposes updates (.github/dependabot.yml).
name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # pytest-homeassistant-custom-component 0.13.375 needs 3.14.2 or newer.
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q
